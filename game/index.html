<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight at the Garuda Vault</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1220; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Dibaca alat bantu, tidak tampil: status game dan hasil autopilot/playtest. */
  #status, #result { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Midnight at the Garuda Vault: pencuri menyelinap di museum malam hari, hindari penjaga dan kamera, ambil artefak lalu kabur lewat EXIT"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<p id="result" aria-hidden="true"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
